<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Log Tailorer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            max-width: 900px; margin: 40px auto; padding: 0 20px; 
            color: var(--text); background-color: var(--background); line-height: 1.6;
        }
        .card {
            background: var(--card-bg); padding: 30px; border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 24px; border: 1px solid var(--border);
        }
        label { display: block; font-weight: 600; margin-top: 15px; margin-bottom: 5px; }
        input[type="password"], textarea, select { 
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px;
            box-sizing: border-box; font-size: 15px; background: white;
        }
        textarea { height: 150px; resize: vertical; }
        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        button { 
            background: var(--primary); color: white; border: none; padding: 12px 24px; 
            font-size: 16px; font-weight: 500; cursor: pointer; border-radius: 6px; margin-top: 20px;
        }
        button:hover { background: var(--primary-hover); }
        .status { font-style: italic; color: #64748b; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🚀 AI Career Log Tailorer</h1>
    
    <div class="card">
        <!-- Row 1: API Configuration -->
        <label for="apiKey">Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AIzkSy...">

        <!-- Row 2: Contact Information Input Fields -->
        <label style="margin-top: 10px;">Contact Information & Header (Injected at the top of your resume)</label>
        <div class="row">
            <div class="col"><input type="text" id="contactName" placeholder="Michel Devio"></div>
            <div class="col"><input type="text" id="jobTitle" placeholder="Senior Embedded Software Engineer"></div>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col"><input type="text" id="contactPhone" placeholder="06 09 14 22 35"></div>
            <div class="col"><input type="text" id="contactEmail" placeholder="michel.devio@notadomain.fr"></div>
        </div>
        
        <!-- Row 3: Repository File Selections -->
        <div class="row" style="margin-top: 15px;">
            <div class="col">
                <label for="logSelect">Select Career Log</label>
                <select id="logSelect"><option>Loading logs...</option></select>
            </div>
            <div class="col">
                <label for="cssSelect">Select Style CSS</label>
                <select id="cssSelect"><option>Loading styles...</option></select>
            </div>
        </div>

        <!-- Row 4: AI Behavior Prompt Configurations -->
        <label for="systemPrompt">AI System Instructions (Modify rules here)</label>
        <textarea id="systemPrompt" style="height: 120px;"></textarea>

        <!-- Row 5: Job Constraints Context Box -->
        <label for="jobDescription">Target Job Description</label>
        <textarea id="jobDescription" placeholder="Paste the responsibilities, requirements, or full description of the job here..."></textarea>
        
        <button id="generateBtn" onclick="processPipeline()">Generate & Preview HTML</button>
        <div id="statusMsg" class="status"></div>
        <button id="viewBtn" style="display:none; background: #10b981; margin-top: 10px;">👉 Open Tailored Resume</button>
    </div>

    <script>
        const GITHUB_USER = "drumjoss";
        const GITHUB_REPO = "resume-tailoring";

        // Global variables to store content
        let selectedLogContent = "";
        let selectedCssContent = "";

        // Keep track of the temporary URL globally
        let currentBlobURL = null;
        
       // Your default system instructions template
        const defaultSystemPrompt = `You are an expert technical resume parser and editor. Your goal is to generate a highly tailored, professional resume based on the Career Log and the provided target Job Description.

STRICT INSTRUCTIONS:
1. TRUTHFULNESS: Do not fabricate or invent skills, metrics, roles, dates, or experiences. Only use information present in the Career Log.
2. RELEVANCE FILTERING: Completely omit roles, projects, or bullet points from the log that are not relevant to the job requirements. Keep the contact info block intact at the top.
3. KEYWORD MATCHING: Absolutely do not rephrase or add new phrases to the bullet points, only adapt the vocabulary if necessary to match the terminology, tools, or frameworks requested in the job description. Only filter out whole phrases not parts separated with commas. Keep the bold or formatted keywords from the Career Log.
4. FORMAT: Output your response ONLY as clean, structured Markdown. Do not include conversational introduction/conclusion or markdown wrapping tags. For the formatting, take into account the layout described below and make it look like a concise, clear and easily readable google resume.

RESUME LAYOUT:
1. Name
2. Job Title
3. Contact information
4. Professional Summary
5. Skills Summary: Only filtered technology related keywords presents in the Career Log in a bullet point list, grouped by theme (no bullet point title).
6. Experiences (No EXP-XYZ numbering) 
 1. Company name: Job Title (No EXP-XYZ numbering)
 2. Dates
 3. Only keep "Achievements / Work", omit titles, just bullet points.
7. Personal Projects
8. Education: Do not filter
9. Certifications and Training: Do not filter
10. Hobbies`;

        window.onload = function() {
            // Populate defaults
            document.getElementById('systemPrompt').value = defaultSystemPrompt;

            if (localStorage.getItem('gemini_api_key')) {
                document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key');
            }
            fetchRepoFiles('career_log', 'logSelect');
            fetchRepoFiles('css', 'cssSelect');
        };

        async function fetchRepoFiles(path, selectId) {
            const selectEl = document.getElementById(selectId);
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`);
                if (!response.ok) throw new Error("Could not fetch structure");
                const files = await response.json();
                selectEl.innerHTML = "";
                files.forEach(file => {
                    if(file.type === 'file') {
                        const option = document.createElement('option');
                        option.value = file.download_url;
                        option.textContent = file.name;
                        selectEl.appendChild(option);
                    }
                });
            } catch (err) {
                selectEl.innerHTML = `<option>Error loading files from /${path}</option>`;
            }
        }

        async function processPipeline() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const jobDescription = document.getElementById('jobDescription').value.trim();
            const customSystemPrompt = document.getElementById('systemPrompt').value.trim();
            const logUrl = document.getElementById('logSelect').value;
            const cssUrl = document.getElementById('cssSelect').value;
            
            // Collect metadata contact values
            const name = document.getElementById('contactName').value.trim()   || "Michel Devio";
            const title = document.getElementById('jobTitle').value.trim()     || "Senior Embedded Software Engineer";
            const phone = document.getElementById('contactPhone').value.trim() || "06 09 14 22 35";
            const email = document.getElementById('contactEmail').value.trim() || "michel.devio@notadomain.fr";

            const statusMsg = document.getElementById('statusMsg');
            const viewBtn = document.getElementById('viewBtn');
            const generateBtn = document.getElementById('generateBtn');

            if (!apiKey || !jobDescription || !logUrl || !cssUrl) {
                alert("Please ensure API key, job description, and file selections are ready.");
                return;
            }

            localStorage.setItem('gemini_api_key', apiKey);
            viewBtn.style.display = "none";
            generateBtn.disabled = true;
            statusMsg.innerText = "Step 1: Fetching target career log context details...";

            try {
                const logRes = await fetch(logUrl);
                selectedLogContent = await logRes.text();
                
                const cssRes = await fetch(cssUrl);
                selectedCssContent = await cssRes.text();

                statusMsg.innerText = "Step 2: Activating Gemini AI pipeline compilation...";

                // Synthesize the injected contact header chunk string
                const contactHeaderMarkdown = `# ${name}\n## ${title}\n📞 ${phone} | ✉️ ${email}\n\n---\n\n`;
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ 
                            parts: [{ 
                                text: `${customSystemPrompt}\n\n### CONTACT HEADER (Always place this at the very top of your document output):\n${contactHeaderMarkdown}\n\n### MASTER LOG DOCUMENT:\n${selectedLogContent}\n\n### TARGET JOB REQUIREMENTS:\n${jobDescription}` 
                            }] 
                        }]
                    })
                });

                if (!response.ok) throw new Error("AI Engine request dropped unexpectedly");
                const aiData = await response.json();
                let tailoredMarkdown = aiData.candidates[0].content.parts[0].text;
                // Removes ```markdown, ```md, or plain ``` from the start, and any ``` from the end (ignoring extra spaces/newlines)
                tailoredMarkdown = tailoredMarkdown.trim().replace(/^```(markdown|md)?\s*/i, "").replace(/```$/, "").trim();

                statusMsg.innerText = "Step 3: Translating processed Markdown into HTML file streams...";
                const htmlBodyContent = marked.parse(tailoredMarkdown);

                const completeHtmlPage = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="utf-8">
                        <title>Tailored Resume Preview - ${name}</title>
                        <style>${selectedCssContent}</style>
                    </head>
                    <body>
                        <div class="resume-container">${htmlBodyContent}</div>
                    </body>
                    </html>
                `;

                if (currentBlobURL) {
                    URL.revokeObjectURL(currentBlobURL);
                }

                const blob = new Blob([completeHtmlPage], { type: 'text/html' });
                currentBlobURL = URL.createObjectURL(blob);
                
                viewBtn.onclick = function() {
                    window.open(currentBlobURL, '_blank');
                };
                
                statusMsg.innerText = "Done! Click the button below to view your tailored resume.";
                viewBtn.style.display = "inline-block";

            } catch (error) {
                console.error(error);
                statusMsg.innerText = "Pipeline processing broke down.";
            } finally {
                generateBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
