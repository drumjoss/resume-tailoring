<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Log Tailorer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            max-width: 900px; margin: 40px auto; padding: 0 20px; 
            color: var(--text); background-color: var(--background); line-height: 1.6;
        }
        .card {
            background: var(--card-bg); padding: 30px; border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 24px; border: 1px solid var(--border);
        }
        label { display: block; font-weight: 600; margin-top: 15px; margin-bottom: 5px; }
        input[type="password"], textarea, select { 
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px;
            box-sizing: border-box; font-size: 15px; background: white;
        }
        textarea { height: 150px; resize: vertical; }
        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        button { 
            background: var(--primary); color: white; border: none; padding: 12px 24px; 
            font-size: 16px; font-weight: 500; cursor: pointer; border-radius: 6px; margin-top: 20px;
        }
        button:hover { background: var(--primary-hover); }
        .status { font-style: italic; color: #64748b; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🚀 AI Career Log Tailorer</h1>
    
    <div class="card">
        <label for="apiKey">Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AIzkSy...">

        <div class="row">
            <div class="col">
                <label for="logSelect">Select Career Log</label>
                <select id="logSelect"><option>Loading logs...</option></select>
            </div>
            <div class="col">
                <label for="cssSelect">Select Style CSS</label>
                <select id="cssSelect"><option>Loading styles...</option></select>
            </div>
        </div>

        <label for="jobDescription">Target Job Description</label>
        <textarea id="jobDescription" placeholder="Paste the job details here..."></textarea>
        
        <button id="generateBtn" onclick="processPipeline()">Generate & Preview HTML</button>
        <div id="statusMsg" class="status"></div>
    </div>

    <script>
        // !!! CONFIGURATION !!!
        // Replace these with your actual GitHub username and repository name
        const GITHUB_USER = "drumjoss";
        const GITHUB_REPO = "resume-tailoring";

        // Global variables to store content
        let selectedLogContent = "";
        let selectedCssContent = "";

        window.onload = function() {
            // Load API Key from local storage if available
            if (localStorage.getItem('gemini_api_key')) {
                document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key');
            }
            // Fetch repository files setup
            fetchRepoFiles('career_log', 'logSelect');
            fetchRepoFiles('css', 'cssSelect');
        };

        // Reads directory paths inside your GitHub Repo dynamically
        async function fetchRepoFiles(path, selectId) {
            const selectEl = document.getElementById(selectId);
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`);
                if (!response.ok) throw new Error("Could not fetch structure");
                
                const files = await response.json();
                selectEl.innerHTML = ""; // clear loading
                
                files.forEach(file => {
                    if(file.type === 'file') {
                        const option = document.createElement('option');
                        option.value = file.download_url; // Direct link to raw content
                        option.textContent = file.name;
                        selectEl.appendChild(option);
                    }
                });
            } catch (err) {
                selectEl.innerHTML = `<option>Error loading files from /${path}</option>`;
            }
        }

        async function processPipeline() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const jobDescription = document.getElementById('jobDescription').value.trim();
            const logUrl = document.getElementById('logSelect').value;
            const cssUrl = document.getElementById('cssSelect').value;
            const statusMsg = document.getElementById('statusMsg');

            if (!apiKey || !jobDescription || !logUrl || !cssUrl) {
                alert("Please ensure API key, job description, and file selections are ready.");
                return;
            }

            localStorage.setItem('gemini_api_key', apiKey);
            statusMsg.innerText = "Step 1: Fetching selected career log and CSS from GitHub...";

            try {
                // Fetch the files directly from GitHub's raw storage
                const logRes = await fetch(logUrl);
                selectedLogContent = await logRes.text();
                
                const cssRes = await fetch(cssUrl);
                selectedCssContent = await cssRes.text();

                statusMsg.innerText = "Step 2: Sending data to Gemini AI for filtering...";

                // System Instructions
                const systemPrompt = `You are a professional resume writer. Tailor the Master Career Log to target the Job Description. Keep contact updates. Omit completely irrelevant items. Do not lie or invent data. Return ONLY valid Markdown syntax. No code fences.`;

                // Run AI
                const aiResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `${systemPrompt}\n\n### MASTER LOG:\n${selectedLogContent}\n\n### JOB DESCRIPTION:\n${jobDescription}` }] }]
                    })
                });

                if (!aiResponse.ok) throw new Error("AI Processing Failed");
                const aiData = await aiResponse.json();
                let tailoredMarkdown = aiData.candidates[0].content.parts[0].text;
                tailoredMarkdown = tailoredMarkdown.replace(/^```markdown\n/, "").replace(/```$/, "");

                statusMsg.innerText = "Step 3: Compiling Markdown + CSS into localized Page...";

                // Convert MD string to HTML string using Marked library
                const htmlBodyContent = marked.parse(tailoredMarkdown);

                // Build a standalone HTML document wrapping your selected CSS layout
                const completeHtmlPage = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="utf-8">
                        <title>Tailored Resume Preview</title>
                        <style>
                            /* Injects your repository css directly */
                            ${selectedCssContent}
                        </style>
                    </head>
                    <body>
                        <div class="resume-container">
                            ${htmlBodyContent}
                        </div>
                    </body>
                    </html>
                `;

                // Create a temporary data URL blob and tell the browser to open it in a blank tab
                const blob = new Blob([completeHtmlPage], { type: 'text/html' });
                const blobURL = URL.createObjectURL(blob);
                
                statusMsg.innerText = "Done! Opening preview tab...";
                window.open(blobURL, '_blank');

            } catch (error) {
                console.error(error);
                statusMsg.innerText = "An error occurred in the pipeline.";
            }
        }
    </script>
</body>
</html>
